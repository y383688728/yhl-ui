services:
  yhl-ui:
    image: ${YHL_IMAGE:-yhl-ui:0.1.2}
    build: .
    network_mode: host
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["serve", "--http-port", "${YHL_HTTP_PORT:-19999}", "--public-port", "${YHL_PUBLIC_PORT:-0}"]
    volumes:
      - yhl-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + sys.argv[1] + '/healthz', timeout=3)", "${YHL_HTTP_PORT:-19999}"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 20s

volumes:
  yhl-data:
